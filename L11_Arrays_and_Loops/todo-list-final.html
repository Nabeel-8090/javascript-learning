<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Final</title>
    <style>
        body {
            font-family: Arial;
        }

        .todo-name, .todo-due-date {
            font-size: 15px;
            padding: 6px;
        }

        .list, .todo-input-grid {
            display: grid;
            grid-template-columns: 200px 150px 100px;
            column-gap: 10px;
            row-gap: 10px;
            align-items: center;
        }

        .todo-input-grid {
            margin-bottom: 10px;
            align-items: stretch;
        }

        .add-btn {
            border: none;
            cursor: pointer;
            background-color: green;
            font-size: 15px;
            color: white;
        }

        .delete-btn {
            border: none;
            cursor: pointer;
            background-color: darkred;
            font-size: 15px;
            padding: 10px 0px 10px 0px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <div class="todo-input-grid">
        <input placeholder="Todo name" class="todo-name">
        <input type="date" class="todo-due-date">
        <button class="add-btn">Add</button>
    </div>
    <div class="list"></div>
    
    <script>
        const todoName = document.querySelector(".todo-name");
        const todoDueDate = document.querySelector(".todo-due-date");
        const addButton = document.querySelector(".add-btn");

        let todoList = JSON.parse(localStorage.getItem("todoList")) || [];
        renderList();

        function renderList() {
            localStorage.setItem("todoList", JSON.stringify(todoList));

            let todoListHTML = '';
            for (let i=0; i<todoList.length; i++) {
                const { name, dueDate } = todoList[i];

                const html = `<div>${name}</div>
                              <div>${dueDate}</div>
                              <button class="delete-btn" onclick="
                                todoList.splice(${i}, 1);
                                renderList();
                              ">Delete</button>`;
                todoListHTML += html;
            }
            document.querySelector(".list").innerHTML = todoListHTML;
        }

        addButton.addEventListener("click", () => {
            const name = todoName.value;
            const dueDate = todoDueDate.value;

            if (name !== '' && dueDate !== '') {
                todoList.push({name, dueDate});

                renderList();

                todoName.value = '';
                todoDueDate.value = '';          
            }
        });
    </script>
</body>
</html>
