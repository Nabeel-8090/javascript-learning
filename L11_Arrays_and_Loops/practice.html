<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <script>
        const nums = [10, 20, 30];
        nums[nums.length - 1] = 99;
        console.log(nums);

        function getLastValue(array) {
            console.log(array[array.length-1]);
        }
        getLastValue(['hi', 'hello', 'good']);

        function arraySwap(array) {
            let temp = array[0];
            array[0] = array[array.length-1];
            array[array.length-1] = temp;
            return array;
        }
        console.log(arraySwap(['hi', 'hello', 'good']));

        for (let i=0; i<=10; i+=2) {
            console.log(i);
        }

        for (let i=5; i>=0; i--) {
            console.log(i);
        }

        const array_11g = [1, 2, 3];
        for (let i=0; i<array_11g.length; i++) {
            array_11g[i]++;
        }
        console.log(array_11g);

        function addOne(array) {
            for (let i=0; i<array.length; i++) {
                array[i]++;
            }
            return array;
        }
        console.log(addOne([-2, -1, 0, 99]));

        function addNum(array, num) {
            for (let i=0; i<array.length; i++) {
                array[i] += num;
            }
            return array;
        }
        console.log(addNum([1, 2, 3], 2));

        function addArrays(array1, array2) {
            let resultArray = [];
            for (let i=0; i<array1.length; i++) {
                resultArray.push(array1[i] + array2[i]);
            }
            return resultArray;
        }
        console.log(addArrays([1, 1, 2], [1, 1, 3]));

        function countPositive(nums) {
            let count = 0;
            for (let i=0; i<nums.length; i++) {
                if (nums[i] > 0) {
                    count++;
                }
            }
            return count;
        }
        console.log(countPositive([-2, 3, -5, 7, 10]));

        // Challenge Exercises
        function minMax(nums) {
            let min = Infinity;
            let max = -Infinity;

            if (nums.length === 0) {
                return {min: null, max: null};
            } else if (nums.length === 1) {
                return {min: nums[0], max: nums[0]};
            }

            for (let i=0; i<nums.length; i++) {
                if (nums[i] < min) {
                    min = nums[i];
                }
                if (nums[i] > max) {
                    max = nums[i];
                }
            }

            return {min, max};
        }
        const result = minMax([-2, 3, -5, 7, 10]);
        console.log(typeof result);
        console.log("Min:", result["min"]);
        console.log("Max:", result.max);


        function countWords(words) {
            const countWordsObject = {};

            for (let i=0; i<words.length; i++) {
                if (countWordsObject[words[i]]) {
                    countWordsObject[words[i]]++;
                } else {
                    countWordsObject[words[i]] = 1;
                }
            }

            return countWordsObject;
        }
        const countWordsObject = countWords(['apple', 'grape', 'apple', 'apple']);
        console.log(countWordsObject);
    </script>
</body>
</html>
