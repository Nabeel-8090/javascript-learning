<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays & Loops II</title>
</head>
<body>
    <script>
        const array1 = [1, 2, 3];

        const array2 = array1;
        array2.push(4);

        console.log(array1); // [1, 2, 3, 4]
        console.log(array2); // [1, 2, 3, 4]

        // How to avoid this
        const array3 = array1.slice(); // make copy of it
        array3.push(5);

        console.log(array1); // [1, 2, 3, 4]
        console.log(array3); // [1, 2, 3, 4, 5]


        // Shortcut: Destructing
        const [firstValue, secondValue, thirdValue] = [1, 2, 3];
        console.log(firstValue);

        // More details about loops (break & continue)
        for (let i=1; i<=10; i++) {
            if (i % 3 === 0) {
                continue;
            }

            console.log(i);
            if (i === 8) {
                break;
            }
        }

        // How to use loops with functions
        function doubleArray(nums) {
            const numsDoubled = [];

            for (let i=0; i<nums.length; i++) {
                numsDoubled.push(nums[i]*2);
            }
            return numsDoubled;
        }
        console.log(doubleArray([0, 1, 3]));
    </script>
</body>
</html>
