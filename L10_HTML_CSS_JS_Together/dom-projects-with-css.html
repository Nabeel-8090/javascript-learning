<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
        .subscribe-btn {
            border: none;
            background-color: black;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .is-subscribed {
            background-color: rgb(240, 240, 240);
            color: black;
        }

        .input-box {
            font-size: 15px;
            padding: 10px;
        }

        .calculate-btn {
            border: none;
            background-color: green;
            font-size: 15px;
            cursor: pointer;
            color: white;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 15px;
            padding-right: 15px;
        }
    </style>
</head>
<body>
    <h2>YouTube Subscribe Button</h2>
    <button class="subscribe-btn">Subscribe</button>
    
    <br>
    <br>

    <h2>Amazon Shipping Calculator</h2>
    <h3>Orders under $40 = +$10 shipping.</h3>
    <h3>Orders over $40 = FREE shipping.</h3>
    <input placeholder="Cost of order" class="input-box">
    <button class="calculate-btn">Calculate</button>
    <h2 class="calculated-result"></h2>

    <script>
        document.querySelector('.subscribe-btn').addEventListener('click', () => {
            const button = document.querySelector('.subscribe-btn');
            if (button.innerText === 'Subscribe') {
                button.innerText = 'Subscribed';
                button.classList.add('is-subscribed');
            } else {
                button.innerText = 'Subscribe';
                button.classList.remove('is-subscribed');
            }
        });

        const inputElement = document.querySelector('input');
        const calculateBtn = document.querySelector('.calculate-btn');
        function calculate() {
            let result = 0;
            if (inputElement.value < 40) {
                result = Number(inputElement.value) + 10;
            } else {
                result = Number(inputElement.value);
            }
            document.querySelector('.calculated-result').innerHTML = `$${result}`;
        }

        calculateBtn.addEventListener('click', () => {
            calculate();
        });
        inputElement.addEventListener('keydown', (event) => {
            if (event.key === "Enter") {
                calculate();
            }
        });
    </script>
</body>
</html>
